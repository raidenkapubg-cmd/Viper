# /etc/nginx/sites-available/viper  ->  ln -s to sites-enabled, then: certbot --nginx -d viper.example.com
# Inbound traffic can arrive on either IP; only OUTBOUND FYERS traffic is IP-pinned (by Viper itself).
map $http_upgrade $connection_upgrade { default upgrade; '' close; }

server {
    listen 80;
    server_name viper.example.com;          # <- your domain
    client_max_body_size 25m;                # PDF / screenshot uploads

    location /ws {
        proxy_pass http://127.0.0.1:8710;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
    location / {
        proxy_pass http://127.0.0.1:8710;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
